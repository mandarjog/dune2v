<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dune II — Browser Skirmish</title>
<style>
:root {
  --bg: #0d0c0a;
  --panel: #1a1814;
  --panel-border: #3d3428;
  --text: #e8dcc8;
  --muted: #9a8b72;
  --accent: #c9a227;
  --player: #4a90d9;
  --enemy: #c0392b;
  --danger: #e74c3c;
  --ok: #27ae60;
  --sidebar-w: 240px;
  font-family: "Segoe UI", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  user-select: none;
}

#app {
  display: flex;
  height: 100%;
  width: 100%;
}

#game-wrap {
  flex: 1;
  position: relative;
  min-width: 0;
  background: #000;
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}

#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: linear-gradient(180deg, #221e18 0%, #14120e 100%);
  border-left: 2px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  overflow-y: auto;
  font-size: 13px;
}

#sidebar h1 {
  font-size: 15px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 6px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.stat-row .label {
  color: var(--muted);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.06em;
}

.stat-row .value {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

#power-bar {
  height: 10px;
  background: #2a241c;
  border: 1px solid var(--panel-border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}

#power-fill {
  height: 100%;
  width: 100%;
  background: var(--ok);
  transition: width 0.1s linear, background 0.2s;
}

#minimap {
  width: 100%;
  aspect-ratio: 1;
  background: #000;
  border: 1px solid var(--panel-border);
  image-rendering: pixelated;
  cursor: pointer;
  display: block;
}

.section-title {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 4px;
}

#build-menu,
#unit-menu,
#selection-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

button.game-btn {
  background: #2c261e;
  color: var(--text);
  border: 1px solid var(--panel-border);
  padding: 6px 8px;
  font-size: 11px;
  cursor: pointer;
  text-align: left;
  border-radius: 2px;
}

button.game-btn:hover:not(:disabled) {
  background: #3a3228;
  border-color: var(--accent);
}

button.game-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

button.game-btn.active {
  border-color: var(--player);
  box-shadow: inset 0 0 0 1px var(--player);
}

button.game-btn.primary {
  background: #3a3020;
  border-color: var(--accent);
  text-align: center;
  font-weight: 600;
}

button.game-btn.icon-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  text-align: left;
}

button.game-btn.icon-btn .btn-icon {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 3px;
  image-rendering: pixelated;
  background: #12100c;
}

button.game-btn.icon-btn .btn-label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  line-height: 1.25;
}

button.game-btn.icon-btn .btn-label strong {
  font-size: 11px;
}

button.game-btn.icon-btn .btn-label .meta {
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
}

button.game-btn.icon-btn .btn-label .meta.cant-afford {
  color: var(--danger);
}

#build-menu .btn-grid,
#unit-menu .btn-grid {
  grid-template-columns: 1fr;
}

.sel-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.sel-icon {
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  border-radius: 3px;
  border: 1px solid var(--panel-border);
  image-rendering: pixelated;
}

#messages {
  flex: 1;
  min-height: 60px;
  max-height: 120px;
  overflow-y: auto;
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--panel-border);
  padding-top: 6px;
}

#messages .msg {
  margin-bottom: 3px;
  line-height: 1.3;
}

#messages .msg.alert {
  color: var(--accent);
}

#debug-overlay {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0, 0, 0, 0.65);
  color: #8f8;
  font: 11px/1.4 ui-monospace, monospace;
  padding: 6px 8px;
  pointer-events: none;
  display: none;
  white-space: pre;
  border-radius: 3px;
}

#debug-overlay.visible {
  display: block;
}

/* Overlays */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-backdrop.hidden {
  display: none;
}

.modal {
  background: var(--panel);
  border: 2px solid var(--accent);
  padding: 28px 36px;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}

.modal h2 {
  color: var(--accent);
  margin-bottom: 12px;
  font-size: 22px;
  letter-spacing: 0.06em;
}

.modal p {
  color: var(--muted);
  margin-bottom: 20px;
  line-height: 1.5;
  font-size: 14px;
}

.modal .actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.modal button {
  background: #2c261e;
  color: var(--text);
  border: 1px solid var(--accent);
  padding: 10px 18px;
  font-size: 13px;
  cursor: pointer;
  min-width: 120px;
}

.modal button:hover {
  background: #3a3228;
}

.modal.victory h2 {
  color: var(--ok);
}
.modal.defeat h2 {
  color: var(--danger);
}

#selection-info .title {
  font-weight: 600;
  color: var(--text);
}

#selection-info .meta {
  color: var(--muted);
  font-size: 11px;
}

.hp-bar {
  height: 6px;
  background: #2a241c;
  border: 1px solid var(--panel-border);
  margin-top: 4px;
  overflow: hidden;
}

.hp-bar > span {
  display: block;
  height: 100%;
  background: var(--ok);
}

.hint {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.35;
  margin-top: 4px;
}
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="debug-overlay"></div>
  </div>
  <aside id="sidebar">
    <h1>Dune II</h1>
    <div class="stat-row"><span class="label">Credits</span><span class="value" id="stat-credits">0 / 1000</span></div>
    <div class="stat-row"><span class="label">Power</span><span class="value" id="stat-power">0 / 0</span></div>
    <div id="power-bar"><div id="power-fill"></div></div>
    <div class="section-title">Minimap</div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <div id="selection-info"><div class="meta">No selection</div></div>
    <div id="unit-menu"></div>
    <div id="build-menu"></div>
    <div class="hint">LMB select · RMB move/attack · E deploy · H harvest · Esc pause · F3 debug</div>
    <div id="messages"></div>
  </aside>
</div>
<div id="menu-modal" class="modal-backdrop">
  <div class="modal">
    <h2>Dune II</h2>
    <p>Unofficial browser skirmish inspired by Westwood’s Dune II.</p>
    <div class="actions">
      <button id="btn-continue" type="button" style="display:none">Continue</button>
      <button id="btn-start" type="button">New Skirmish</button>
    </div>
  </div>
</div>
<div id="pause-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>Paused</h2>
    <div class="actions">
      <button id="btn-resume" type="button">Resume</button>
      <button id="btn-restart" type="button">Restart</button>
    </div>
  </div>
</div>
<div id="end-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>Victory</h2>
    <p></p>
    <div class="actions">
      <button id="btn-end-restart" type="button">Play Again</button>
      <button id="btn-end-menu" type="button">Main Menu</button>
    </div>
  </div>
</div>

/* ---- rng.js ---- */
/* global Dune2 */
(function (global) {
  'use strict';
  const D = (global.Dune2 = global.Dune2 || {});

  let state = 1;

  D.rng = {
    seed(s) {
      state = (s >>> 0) || 1;
    },
    getState() {
      return state;
    },
    setState(s) {
      state = s >>> 0;
    },
    /** Mulberry32 */
    next() {
      state |= 0;
      state = (state + 0x6d2b79f5) | 0;
      let t = Math.imul(state ^ (state >>> 15), 1 | state);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    int(min, max) {
      return min + Math.floor(D.rng.next() * (max - min + 1));
    },
    pick(arr) {
      if (!arr.length) return undefined;
      return arr[Math.floor(D.rng.next() * arr.length)];
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- sprites.js ---- */
/* global Dune2 */
/**
 * Procedural geometric sprites for buildings & units.
 * No external assets — drawn with Canvas 2D paths.
 * draw*(ctx, x, y, w, h, opts) — top-left box in pixel space.
 */
(function (global) {
  'use strict';
  const D = (global.Dune2 = global.Dune2 || {});

  const iconCache = new Map();

  function shade(hex, amt) {
    // amt -1..1
    const n = hex.replace('#', '');
    const full = n.length === 3 ? n.split('').map((c) => c + c).join('') : n;
    const num = parseInt(full, 16);
    let r = (num >> 16) & 255;
    let g = (num >> 8) & 255;
    let b = num & 255;
    r = Math.max(0, Math.min(255, r + Math.round(255 * amt)));
    g = Math.max(0, Math.min(255, g + Math.round(255 * amt)));
    b = Math.max(0, Math.min(255, b + Math.round(255 * amt)));
    return `rgb(${r},${g},${b})`;
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function basePad(ctx, x, y, w, h, col, opts) {
    const pad = opts.pad != null ? opts.pad : 0.06;
    const px = w * pad;
    const py = h * pad;
    // foundation slab
    ctx.fillStyle = 'rgba(30,28,24,0.85)';
    ctx.fillRect(x, y, w, h);
    // main body
    const bx = x + px;
    const by = y + py;
    const bw = w - px * 2;
    const bh = h - py * 2;
    const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
    grad.addColorStop(0, shade(col, 0.18));
    grad.addColorStop(0.5, col);
    grad.addColorStop(1, shade(col, -0.28));
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by, bw, bh, Math.min(bw, bh) * 0.08);
    ctx.fill();
    ctx.strokeStyle = shade(col, -0.45);
    ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.04);
    ctx.stroke();
    // top highlight edge
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + 2, by + 2);
    ctx.lineTo(bx + bw - 2, by + 2);
    ctx.stroke();
    return { bx, by, bw, bh, m: Math.min(bw, bh) };
  }

  function accent(ctx, col) {
    return shade(col, 0.35);
  }

  function metal(ctx, x, y, w, h) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#9a9a9a');
    g.addColorStop(0.5, '#6a6a6a');
    g.addColorStop(1, '#3a3a3a');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#222';
    ctx.strokeRect(x, y, w, h);
  }

  function sandTone() {
    return '#c2a05a';
  }

  // ─── Buildings ───────────────────────────────────────────

  function drawConcrete(ctx, x, y, w, h) {
    ctx.fillStyle = '#7a7a7a';
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
    ctx.strokeStyle = '#555';
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    // tile seams
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + 2);
    ctx.lineTo(x + w / 2, y + h - 2);
    ctx.moveTo(x + 2, y + h / 2);
    ctx.lineTo(x + w - 2, y + h / 2);
    ctx.stroke();
  }

  function drawConstructionYard(ctx, x, y, w, h, col) {
    const b = basePad(ctx, x, y, w, h, col, {});
    // crane arm
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = Math.max(2, b.m * 0.08);
    ctx.beginPath();
    ctx.moveTo(b.bx + b.bw * 0.2, b.by + b.bh * 0.75);
    ctx.lineTo(b.bx + b.bw * 0.2, b.by + b.bh * 0.15);
    ctx.lineTo(b.bx + b.bw * 0.75, b.by + b.bh * 0.2);
    ctx.stroke();
    // hook
    ctx.beginPath();
    ctx.moveTo(b.bx + b.bw * 0.75, b.by + b.bh * 0.2);
    ctx.lineTo(b.bx + b.bw * 0.75, b.by + b.bh * 0.45);
    ctx.stroke();
    ctx.fillStyle = '#f0c040';
    ctx.fillRect(b.bx + b.bw * 0.7, b.by + b.bh * 0.45, b.bw * 0.1, b.bh * 0.12);
    // cabin
    metal(ctx, b.bx + b.bw * 0.35, b.by + b.bh * 0.5, b.bw * 0.35, b.bh * 0.35);
    ctx.fillStyle = accent(ctx, col);
    ctx.fillRect(b.bx + b.bw * 0.4, b.by + b.bh * 0.55, b.bw * 0.12, b.bh * 0.1);
  }

  function drawWindtrap(ctx, x, y, w, h, col, opts) {
    const b = basePad(ctx, x, y, w, h, col, {});
    const cx = b.bx + b.bw * 0.5;
    const cy = b.by + b.bh * 0.48;
    const r = b.m * 0.32;
    // tower
    metal(ctx, cx - b.bw * 0.08, b.by + b.bh * 0.55, b.bw * 0.16, b.bh * 0.35);
    // rotor hub
    ctx.fillStyle = '#eee';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    // blades (animate with time if provided)
    const ang = opts.time != null ? opts.time * 2.5 : 0;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgba(230,230,240,0.92)';
    for (let i = 0; i < 3; i++) {
      ctx.rotate((Math.PI * 2) / 3);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(r * 0.15, -r * 0.15);
      ctx.lineTo(0, -r);
      ctx.lineTo(-r * 0.15, -r * 0.15);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    // glow ring when powered
    if (opts.powered !== false) {
      ctx.strokeStyle = 'rgba(120,200,255,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.05, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawRefinery(ctx, x, y, w, h, col) {
    const b = basePad(ctx, x, y, w, h, col, {});
    // spice tanks
    for (let i = 0; i < 2; i++) {
      const tx = b.bx + b.bw * (0.12 + i * 0.28);
      const ty = b.by + b.bh * 0.2;
      const tw = b.bw * 0.22;
      const th = b.bh * 0.55;
      const g = ctx.createLinearGradient(tx, ty, tx + tw, ty);
      g.addColorStop(0, '#e09020');
      g.addColorStop(0.5, '#c06000');
      g.addColorStop(1, '#8a4000');
      ctx.fillStyle = g;
      roundRect(ctx, tx, ty, tw, th, tw * 0.2);
      ctx.fill();
      ctx.strokeStyle = '#4a2000';
      ctx.stroke();
      // band
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(tx, ty + th * 0.4, tw, th * 0.12);
    }
    // dock bay
    metal(ctx, b.bx + b.bw * 0.62, b.by + b.bh * 0.35, b.bw * 0.3, b.bh * 0.5);
    ctx.fillStyle = '#222';
    ctx.fillRect(b.bx + b.bw * 0.68, b.by + b.bh * 0.55, b.bw * 0.18, b.bh * 0.28);
    // chimney
    ctx.fillStyle = '#444';
    ctx.fillRect(b.bx + b.bw * 0.72, b.by + b.bh * 0.1, b.bw * 0.08, b.bh * 0.28);
  }

  function drawSilo(ctx, x, y, w, h, col) {
    const b = basePad(ctx, x, y, w, h, col, {});
    const cx = b.bx + b.bw * 0.5;
    const top = b.by + b.bh * 0.12;
    const bot = b.by + b.bh * 0.88;
    const rad = b.bw * 0.32;
    // cylinder
    const g = ctx.createLinearGradient(cx - rad, 0, cx + rad, 0);
    g.addColorStop(0, '#d4881a');
    g.addColorStop(0.45, '#f0b040');
    g.addColorStop(1, '#8a5010');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - rad, top + rad * 0.4);
    ctx.lineTo(cx - rad, bot - rad * 0.2);
    ctx.quadraticCurveTo(cx - rad, bot, cx, bot);
    ctx.quadraticCurveTo(cx + rad, bot, cx + rad, bot - rad * 0.2);
    ctx.lineTo(cx + rad, top + rad * 0.4);
    ctx.ellipse(cx, top + rad * 0.4, rad, rad * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = shade('#e0a030', 0.2);
    ctx.beginPath();
    ctx.ellipse(cx, top + rad * 0.4, rad, rad * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    // house stripe
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - rad * 0.7, (top + bot) / 2);
    ctx.lineTo(cx + rad * 0.7, (top + bot) / 2);
    ctx.stroke();
  }

  function drawBarracks(ctx, x, y, w, h, col) {
    const b = basePad(ctx, x, y, w, h, col, {});
    // pitched roof
    ctx.fillStyle = shade(col, -0.35);
    ctx.beginPath();
    ctx.moveTo(b.bx + b.bw * 0.08, b.by + b.bh * 0.42);
    ctx.lineTo(b.bx + b.bw * 0.5, b.by + b.bh * 0.12);
    ctx.lineTo(b.bx + b.bw * 0.92, b.by + b.bh * 0.42);
    ctx.closePath();
    ctx.fill();
    // body
    ctx.fillStyle = shade(col, -0.1);
    ctx.fillRect(b.bx + b.bw * 0.12, b.by + b.bh * 0.42, b.bw * 0.76, b.bh * 0.45);
    // door
    ctx.fillStyle = '#2a2018';
    ctx.fillRect(b.bx + b.bw * 0.4, b.by + b.bh * 0.55, b.bw * 0.2, b.bh * 0.32);
    // windows
    ctx.fillStyle = '#f0e080';
    ctx.fillRect(b.bx + b.bw * 0.2, b.by + b.bh * 0.55, b.bw * 0.12, b.bh * 0.12);
    ctx.fillRect(b.bx + b.bw * 0.68, b.by + b.bh * 0.55, b.bw * 0.12, b.bh * 0.12);
    // flag
    ctx.strokeStyle = '#ccc';
    ctx.beginPath();
    ctx.moveTo(b.bx + b.bw * 0.5, b.by + b.bh * 0.12);
    ctx.lineTo(b.bx + b.bw * 0.5, b.by + b.bh * 0.02);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.fillRect(b.bx + b.bw * 0.5, b.by + b.bh * 0.02, b.bw * 0.18, b.bh * 0.08);
  }

  function drawLightFactory(ctx, x, y, w, h, col) {
    const b = basePad(ctx, x, y, w, h, col, {});
    metal(ctx, b.bx + b.bw * 0.1, b.by + b.bh * 0.2, b.bw * 0.8, b.bh * 0.55);
    // garage door
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(b.bx + b.bw * 0.22, b.by + b.bh * 0.4, b.bw * 0.56, b.bh * 0.32);
    ctx.strokeStyle = '#555';
    for (let i = 1; i < 4; i++) {
      const yy = b.by + b.bh * 0.4 + (b.bh * 0.32 * i) / 4;
      ctx.beginPath();
      ctx.moveTo(b.bx + b.bw * 0.22, yy);
      ctx.lineTo(b.bx + b.bw * 0.78, yy);
      ctx.stroke();
    }
    // sign: light vehicle
    ctx.fillStyle = accent(ctx, col);
    ctx.beginPath();
    ctx.moveTo(b.bx + b.bw * 0.35, b.by + b.bh * 0.28);
    ctx.lineTo(b.bx + b.bw * 0.65, b.by + b.bh * 0.28);
    ctx.lineTo(b.bx + b.bw * 0.58, b.by + b.bh * 0.36);
    ctx.lineTo(b.bx + b.bw * 0.42, b.by + b.bh * 0.36);
    ctx.closePath();
    ctx.fill();
    // smokestack
    ctx.fillStyle = '#333';
    ctx.fillRect(b.bx + b.bw * 0.78, b.by + b.bh * 0.08, b.bw * 0.1, b.bh * 0.2);
  }

  function drawHeavyFactory(ctx, x, y, w, h, col) {
    const b = basePad(ctx, x, y, w, h, col, {});
    metal(ctx, b.bx + b.bw * 0.06, b.by + b.bh * 0.18, b.bw * 0.88, b.bh * 0.6);
    // big bay
    ctx.fillStyle = '#111';
    ctx.fillRect(b.bx + b.bw * 0.15, b.by + b.bh * 0.38, b.bw * 0.7, b.bh * 0.35);
    // tank silhouette inside
    ctx.fillStyle = shade(col, 0.1);
    ctx.beginPath();
    ctx.moveTo(b.bx + b.bw * 0.28, b.by + b.bh * 0.58);
    ctx.lineTo(b.bx + b.bw * 0.35, b.by + b.bh * 0.48);
    ctx.lineTo(b.bx + b.bw * 0.65, b.by + b.bh * 0.48);
    ctx.lineTo(b.bx + b.bw * 0.72, b.by + b.bh * 0.58);
    ctx.closePath();
    ctx.fill();
    // dual stacks
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(b.bx + b.bw * 0.2, b.by + b.bh * 0.05, b.bw * 0.1, b.bh * 0.2);
    ctx.fillRect(b.bx + b.bw * 0.35, b.by + b.bh * 0.08, b.bw * 0.1, b.bh * 0.17);
    // hazard stripe
    ctx.fillStyle = '#e0c040';
    ctx.fillRect(b.bx + b.bw * 0.15, b.by + b.bh * 0.72, b.bw * 0.7, b.bh * 0.06);
    ctx.fillStyle = '#222';
    for (let i = 0; i < 6; i++) {
      ctx.fillRect(
        b.bx + b.bw * 0.15 + i * b.bw * 0.12,
        b.by + b.bh * 0.72,
        b.bw * 0.06,
        b.bh * 0.06
      );
    }
  }

  function drawGunTurret(ctx, x, y, w, h, col, opts) {
    const b = basePad(ctx, x, y, w, h, col, { pad: 0.08 });
    const cx = b.bx + b.bw / 2;
    const cy = b.by + b.bh / 2;
    const r = b.m * 0.38;
    // base ring
    ctx.fillStyle = shade(col, -0.2);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.stroke();
    // dome
    const g = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, r * 0.1, cx, cy, r * 0.75);
    g.addColorStop(0, shade(col, 0.25));
    g.addColorStop(1, shade(col, -0.35));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.72, 0, Math.PI * 2);
    ctx.fill();
    // barrel
    const ang = opts.facing != null ? opts.facing : -Math.PI / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    metal(ctx, r * 0.3, -r * 0.12, r * 0.95, r * 0.24);
    ctx.fillStyle = '#222';
    ctx.fillRect(r * 1.1, -r * 0.08, r * 0.2, r * 0.16);
    ctx.restore();
  }

  function drawWall(ctx, x, y, w, h, col) {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, shade(col, 0.15));
    g.addColorStop(1, shade(col, -0.35));
    ctx.fillStyle = g;
    ctx.fillRect(x + w * 0.08, y + h * 0.08, w * 0.84, h * 0.84);
    ctx.strokeStyle = '#111';
    ctx.strokeRect(x + w * 0.08, y + h * 0.08, w * 0.84, h * 0.84);
    // battlements
    const n = 3;
    const bw = (w * 0.84) / n;
    ctx.fillStyle = shade(col, -0.1);
    for (let i = 0; i < n; i++) {
      if (i % 2 === 0) {
        ctx.fillRect(
          x + w * 0.08 + i * bw + 1,
          y + h * 0.02,
          bw - 2,
          h * 0.14
        );
      }
    }
  }

  function drawRadar(ctx, x, y, w, h, col, opts) {
    const b = basePad(ctx, x, y, w, h, col, {});
    const cx = b.bx + b.bw * 0.5;
    const cy = b.by + b.bh * 0.42;
    const r = b.m * 0.28;
    // dish base
    metal(ctx, cx - b.bw * 0.06, cy, b.bw * 0.12, b.bh * 0.45);
    // dish
    ctx.save();
    ctx.translate(cx, cy);
    const spin = opts.time != null ? opts.time * 1.2 : 0;
    ctx.rotate(Math.sin(spin) * 0.4);
    ctx.fillStyle = '#d0d8e0';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.3, r * 0.55, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#445';
    ctx.stroke();
    // sweep glow
    ctx.fillStyle = 'rgba(100,220,140,0.35)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r * 1.1, spin, spin + 0.8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // screen blip box
    ctx.fillStyle = '#0a2010';
    ctx.fillRect(b.bx + b.bw * 0.15, b.by + b.bh * 0.72, b.bw * 0.7, b.bh * 0.16);
    ctx.fillStyle = '#3f8';
    ctx.beginPath();
    ctx.arc(
      b.bx + b.bw * (0.3 + 0.4 * (0.5 + 0.5 * Math.sin((opts.time || 0) * 3))),
      b.by + b.bh * 0.8,
      2,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  // ─── Units ───────────────────────────────────────────────

  function drawInfantry(ctx, x, y, w, h, col) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const s = Math.min(w, h);
    // body
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(cx, cy + s * 0.08, s * 0.28, 0, Math.PI * 2);
    ctx.fill();
    // head
    ctx.fillStyle = shade(col, 0.2);
    ctx.beginPath();
    ctx.arc(cx, cy - s * 0.22, s * 0.16, 0, Math.PI * 2);
    ctx.fill();
    // rifle
    ctx.strokeStyle = '#222';
    ctx.lineWidth = Math.max(2, s * 0.08);
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.1, cy);
    ctx.lineTo(cx + s * 0.42, cy - s * 0.05);
    ctx.stroke();
  }

  function drawTrooper(ctx, x, y, w, h, col) {
    drawInfantry(ctx, x, y, w, h, col);
    const cx = x + w / 2;
    const cy = y + h / 2;
    const s = Math.min(w, h);
    // rocket tube on shoulder
    ctx.fillStyle = '#333';
    ctx.fillRect(cx - s * 0.35, cy - s * 0.15, s * 0.2, s * 0.35);
    ctx.fillStyle = '#555';
    ctx.fillRect(cx - s * 0.38, cy - s * 0.2, s * 0.26, s * 0.1);
  }

  function drawTrike(ctx, x, y, w, h, col, opts) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const s = Math.min(w, h);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(opts.facing || 0);
    // body
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(s * 0.4, 0);
    ctx.lineTo(s * 0.1, -s * 0.28);
    ctx.lineTo(-s * 0.35, -s * 0.22);
    ctx.lineTo(-s * 0.35, s * 0.22);
    ctx.lineTo(s * 0.1, s * 0.28);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.stroke();
    // wheels
    ctx.fillStyle = '#222';
    [[-0.2, -0.3], [-0.2, 0.3], [0.2, 0]].forEach(([wx, wy]) => {
      ctx.beginPath();
      ctx.arc(s * wx, s * wy, s * 0.1, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawQuad(ctx, x, y, w, h, col, opts) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const s = Math.min(w, h);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(opts.facing || 0);
    ctx.fillStyle = col;
    roundRect(ctx, -s * 0.4, -s * 0.28, s * 0.8, s * 0.56, s * 0.08);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.stroke();
    // turret
    ctx.fillStyle = shade(col, -0.15);
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.16, 0, Math.PI * 2);
    ctx.fill();
    metal(ctx, s * 0.1, -s * 0.05, s * 0.35, s * 0.1);
    // 4 wheels
    ctx.fillStyle = '#1a1a1a';
    [
      [-0.28, -0.32],
      [-0.28, 0.32],
      [0.22, -0.32],
      [0.22, 0.32],
    ].forEach(([wx, wy]) => {
      ctx.beginPath();
      ctx.arc(s * wx, s * wy, s * 0.1, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawCombatTank(ctx, x, y, w, h, col, opts) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const s = Math.min(w, h);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(opts.facing || 0);
    // treads
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-s * 0.42, -s * 0.34, s * 0.84, s * 0.16);
    ctx.fillRect(-s * 0.42, s * 0.18, s * 0.84, s * 0.16);
    // hull
    ctx.fillStyle = col;
    roundRect(ctx, -s * 0.38, -s * 0.22, s * 0.76, s * 0.44, s * 0.06);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.stroke();
    // turret
    ctx.fillStyle = shade(col, -0.12);
    ctx.beginPath();
    ctx.arc(-s * 0.05, 0, s * 0.18, 0, Math.PI * 2);
    ctx.fill();
    // cannon
    metal(ctx, s * 0.05, -s * 0.06, s * 0.48, s * 0.12);
    ctx.restore();
  }

  function drawHarvester(ctx, x, y, w, h, col, opts) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const s = Math.min(w, h);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(opts.facing || 0);
    // body
    ctx.fillStyle = col;
    roundRect(ctx, -s * 0.45, -s * 0.28, s * 0.9, s * 0.56, s * 0.06);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.stroke();
    // cabin
    metal(ctx, s * 0.1, -s * 0.18, s * 0.28, s * 0.36);
    ctx.fillStyle = accent(ctx, col);
    ctx.fillRect(s * 0.16, -s * 0.1, s * 0.12, s * 0.1);
    // spice hopper
    const cargo = opts.cargoRatio != null ? opts.cargoRatio : 0;
    ctx.fillStyle = '#3a2a10';
    ctx.fillRect(-s * 0.38, -s * 0.18, s * 0.4, s * 0.36);
    ctx.fillStyle = '#e09020';
    ctx.fillRect(-s * 0.38, -s * 0.18 + s * 0.36 * (1 - cargo), s * 0.4, s * 0.36 * cargo);
    // scoop
    ctx.fillStyle = '#555';
    ctx.fillRect(-s * 0.55, -s * 0.12, s * 0.12, s * 0.24);
    ctx.restore();
  }

  function drawMCV(ctx, x, y, w, h, col, opts) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const s = Math.min(w, h);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(opts.facing || 0);
    // trailer
    ctx.fillStyle = col;
    roundRect(ctx, -s * 0.48, -s * 0.3, s * 0.7, s * 0.6, s * 0.05);
    ctx.fill();
    // cab
    ctx.fillStyle = shade(col, -0.15);
    roundRect(ctx, s * 0.15, -s * 0.26, s * 0.32, s * 0.52, s * 0.05);
    ctx.fill();
    ctx.fillStyle = '#89c';
    ctx.fillRect(s * 0.28, -s * 0.14, s * 0.14, s * 0.14);
    // folded crane
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-s * 0.3, -s * 0.1);
    ctx.lineTo(-s * 0.1, -s * 0.35);
    ctx.lineTo(s * 0.1, -s * 0.2);
    ctx.stroke();
    // wheels
    ctx.fillStyle = '#222';
    [-0.3, 0, 0.28].forEach((wx) => {
      ctx.fillRect(s * wx - s * 0.06, s * 0.28, s * 0.12, s * 0.1);
    });
    ctx.restore();
  }

  const buildingDrawers = {
    concrete: (ctx, x, y, w, h) => drawConcrete(ctx, x, y, w, h),
    constructionYard: drawConstructionYard,

      attacker.tileW != null
        ? D.Entities.buildingCenter(attacker)
        : { x: attacker.x, y: attacker.y };

      y0: from.y,

        : { x: target.x, y: target.y };

            ? D.Entities.buildingCenter(target)
            : { x: target.x, y: target.y };

        b.weapon.cooldownLeft = Math.max(0, b.weapon.cooldownLeft - dt);
        const c = D.Entities.buildingCenter(b);

        let best = null;
        let bestD = def.weapon.range + 0.01;
        for (const o of game.units) {
          if (o.owner === b.owner || o.hp <= 0) continue;
          if (!D.Combat.canSee(game, b.owner, o.x, o.y)) continue;
          const d = Math.hypot(c.x - o.x, c.y - o.y);
          if (d < bestD) {
            bestD = d;
            best = o;
          }
        }
        if (best) {
          const tc = { x: best.x, y: best.y };
          b._aimFacing = Math.atan2(tc.y - c.y, tc.x - c.x);
          if (b.weapon.cooldownLeft === 0) {
            if (def.weapon.projectile) fireProjectile(game, b, best, def.weapon);

            b.weapon.cooldownLeft = def.weapon.cooldown;

        p.life -= dt;

            target.tileW != null
              ? D.Entities.buildingCenter(target)
              : { x: target.x, y: target.y };

          p.ty = tc.y;

          p.y += (dy / dist) * step;

      if (game.fx) {
        for (let i = game.fx.length - 1; i >= 0; i--) {

          if (game.fx[i].life <= 0) game.fx.splice(i, 1);

(function (global) {

  const OWNER = 'enemy';

  function countBuildings(game, type) {
    return game.buildings.filter(
      (b) => b.owner === OWNER && b.type === type && b.buildProgress >= 1
    ).length;
  }

  function countQueuedOrBuilt(game, type) {
    let n = countBuildings(game, type);
    n += game.buildings.filter(
      (b) => b.owner === OWNER && b.type === type && b.buildProgress < 1
    ).length;
    return n;
  }

  function combatUnits(game) {
    return game.units.filter((u) => {
      if (u.owner !== OWNER || u.hp <= 0) return false;
      if (u.type === 'harvester' || u.type === 'mcv') return false;
      const def = D.config.units[u.type];
      return def && def.weapon;
    });
  }

  function findCY(game, owner) {
    return game.buildings.find(
      (b) => b.owner === owner && b.type === 'constructionYard' && b.buildProgress >= 1
    );
  }

  function spiralPlace(game, type, originX, originY) {
    const maxR = D.config.ai.placement.spiralMaxRadius;
    const def = D.config.buildings[type];
    // try preferred offset for refinery toward spice
    if (type === 'refinery') {
      const spice = D.Map.findNearestSpice(game.map, originX, originY);
      if (spice) {
        const dirX = spice.x - originX;
        const dirY = spice.y - originY;
        const len = Math.hypot(dirX, dirY) || 1;
        for (let dist = 3; dist <= D.config.ai.placement.refineryTowardSpiceRange; dist++) {
          const tx = Math.floor(originX + (dirX / len) * dist) - Math.floor(def.tileW / 2);
          const ty = Math.floor(originY + (dirY / len) * dist) - Math.floor(def.tileH / 2);
          if (D.Map.canPlace(game, type, tx, ty, OWNER)) return { tx, ty };
        }
      }
    }
    for (let r = 0; r <= maxR; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r && r > 0) continue;
          const tx = Math.floor(originX) + dx;
          const ty = Math.floor(originY) + dy;
          if (D.Map.canPlace(game, type, tx, ty, OWNER)) return { tx, ty };
        }
      }
    }
    return null;
  }

  function updateMemory(game) {
    // last seen player CY / units
    for (const b of game.buildings) {
      if (b.owner !== 'player' || b.hp <= 0) continue;
      const c = D.Entities.buildingCenter(b);
      if (D.Map.isVisible(game, OWNER, Math.floor(c.x), Math.floor(c.y))) {
        if (b.type === 'constructionYard') {
          game.ai.memory.enemyCY = { x: c.x, y: c.y, t: game.tick };
        }
        game.ai.memory.lastEnemyBuilding = { x: c.x, y: c.y, t: game.tick };
      }
    }
    for (const u of game.units) {
      if (u.owner !== 'player' || u.hp <= 0) continue;
      if (D.Map.isVisible(game, OWNER, Math.floor(u.x), Math.floor(u.y))) {

  }

  function tryBuild(game, type) {

    if (!D.Economy.hasTech(game, OWNER, def.requires)) return false;
    if (!D.Economy.canAfford(game, OWNER, def.cost)) return false;
    // already building this?
    if (game.buildings.some((b) => b.owner === OWNER && b.type === type && b.buildProgress < 1)) {
      return false;
    }
    const cy = findCY(game, OWNER);
    if (!cy && type !== 'constructionYard') return false;
    const ox = cy ? cy.tileX + cy.tileW / 2 : 55;
    const oy = cy ? cy.tileY + cy.tileH / 2 : 8;
    const spot = spiralPlace(game, type, ox, oy);
    if (!spot) return false;

        b.type === udef.builtAt &&

      ty = game.ai.memory.enemyCY.y;

      tx = game.ai.memory.lastEnemyBuilding.x;
      ty = game.ai.memory.lastEnemyBuilding.y;
    } else if (game.ai.memory.lastEnemyUnit) {

      ty = game.ai.memory.lastEnemyUnit.y;

      const c = D.Entities.buildingCenter(cy);

      game,
      army.map((u) => u.id),
      { type: 'attack-move', x: mem.x, y: mem.y }
    );
  }

    if (findCY(game, OWNER)) return;

    if (D.Orders.canDeploy(game, mcv.id)) {
      D.Orders.issue(game, [mcv.id], { type: 'deploy' });
    } else {
      // find rock near spawn
      const map = game.map;
      for (let r = 0; r < 15; r++) {
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const tx = Math.floor(mcv.x) + dx;
            const ty = Math.floor(mcv.y) + dy;
            if (D.Map.tileAt(map, tx, ty) === D.config.terrain.ROCK) {
              D.Orders.issue(game, [mcv.id], { type: 'move', x: tx + 0.5, y: ty + 0.5 });

              return;
            }
          }
        }
      }
    }
  }

    tick(game, dt) {

      if (game.phase !== 'playing') return;

      bootstrapMCV(game);

        const w1 = D.Renderer.screenToWorld(game, box.x1, box.y1);
        const minX = Math.min(w0.x, w1.x);
        const maxX = Math.max(w0.x, w1.x);
        const minY = Math.min(w0.y, w1.y);

      if (!units.length) return;

      const hit = pickAt(game, world.x, world.y);

      if (hit && hit.entity.owner === 'enemy') {
        D.Orders.issue(
          game,
          units.map((u) => u.id),
          { type: 'attack', targetId: hit.entity.id }

      }

      const ty = Math.floor(world.y);
      const harvs = units.filter((u) => u.type === 'harvester');

          game,
          harvs.map((u) => u.id),
          { type: 'harvest', tileX: tx, tileY: ty }

(function (global) {
  'use strict';
  const D = (global.Dune2 = global.Dune2 || {});

  const MAX_FRAME_MS = 100;

  D.Loop = {
    _running: false,
    _lastMs: 0,
    _accMs: 0,
    _raf: 0,
    _frames: 0,
    _fpsT: 0,
    game: null,

    start(game) {
      D.Loop.game = game;
      D.Loop._running = true;
      D.Loop._lastMs = performance.now();
      D.Loop._accMs = 0;
      D.Loop._frames = 0;
      D.Loop._fpsT = D.Loop._lastMs;
      const frame = (now) => {
        if (!D.Loop._running) return;
        D.Loop._raf = requestAnimationFrame(frame);
        D.Loop.tickFrame(now);
      };
      D.Loop._raf = requestAnimationFrame(frame);
    },

    stop() {
      D.Loop._running = false;
      if (D.Loop._raf) cancelAnimationFrame(D.Loop._raf);
    },

    tickFrame(nowMs) {
      const game = D.Loop.game;
      if (!game) return;

      let frameMs = Math.min(nowMs - D.Loop._lastMs, MAX_FRAME_MS);
      D.Loop._lastMs = nowMs;
      D.Loop._accMs += frameMs;

      // FPS
      D.Loop._frames++;
      if (nowMs - D.Loop._fpsT >= 500) {
        game.stats.fps = (D.Loop._frames * 1000) / (nowMs - D.Loop._fpsT);
        D.Loop._frames = 0;
        D.Loop._fpsT = nowMs;
      }

      const dtSec = D.config.DT_SEC;
      const stepMs = dtSec * 1000;

      // input poll uses real dt for smooth camera
      if (D.Input) D.Input.poll(game, frameMs / 1000);

      if (game.phase === 'playing') {
        let guard = 0;
        while (D.Loop._accMs >= stepMs && guard < 5) {
          D.Game.tick(game, dtSec);
          D.Loop._accMs -= stepMs;
          guard++;
        }
        // avoid spiral: dump excess
        if (D.Loop._accMs > stepMs * 3) D.Loop._accMs = 0;
      } else {
        D.Loop._accMs = 0;
      }

      if (D.Renderer) D.Renderer.draw(game);
      if (D.UI) {
        // HUD stats every few ticks; selection panel only rebuilds when signature changes
        if (game.tick % 4 === 0 || game.phase !== 'playing') D.UI.refresh(game);
        D.UI.updateDebug(game);
      }

      // Autosave every ~15s while playing
      if (
        D.Save &&
        game.phase === 'playing' &&
        game.tick > 0 &&
        game.tick % 300 === 0
      ) {
        D.Save.write(game);
      }
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

        controlGroups: JSON.parse(JSON.stringify(game.controlGroups)),

        rngState: D.rng.getState(),
        features: {

        map: {
          width: map.width,
          height: map.height,
          tiles: arr(map.tiles),
          spiceAmount: arr(map.spiceAmount),
          blocked: arr(map.blocked),
          spawns: map.spawns,

          hpMax: u.hpMax,
          facing: u.facing,
          order: u.order,
          orders: u.orders,

          weapon: u.weapon,
          cargo: u.cargo,
          cargoMax: u.cargoMax,
          harvest: u.harvest,
          sight: u.sight,

        buildings: game.buildings.map((b) => ({

          type: b.type,

      if (el) el.classList.add('visible');
    }
    if (params.get('fog') === '0') {
      D.config.features.fog = false;
    }
    if (params.get('ai') === '0') {
      D.config.features.ai = false;
    }

    const game = D.Game.create();
    const canvas = document.getElementById('game-canvas');
    const minimap = document.getElementById('minimap');

    // minimap resolution
    minimap.width = 200;
    minimap.height = 200;

    D.Renderer.init(canvas, minimap);
    D.Input.init(game, canvas, minimap);
    D.UI.init(game);
    D.Loop.start(game);

    // Persist on tab close / refresh
    window.addEventListener('beforeunload', () => {
      if (D.Save && game.phase === 'playing') D.Save.write(game);
    });

    // expose for console debugging
    window.__dune2 = { game, D };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
