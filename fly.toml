# fly.toml app configuration file generated for dune2v
# See https://fly.io/docs/reference/configuration/

app = 'dune2v'
primary_region = 'sjc'

[build]

# Persistent MP replays / data (1GB volume dune2v_data in sjc)
[mounts]
  source = 'dune2v_data'
  destination = '/data'

[env]
  RECORDINGS_DIR = '/data/recordings'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep exactly one always-on machine: rooms are in-process memory.
  # Two machines would split hosts/guests across different room maps.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
