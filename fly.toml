# fly.toml app configuration file generated for dune2v
# See https://fly.io/docs/reference/configuration/

app = 'dune2v'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep at least one machine up so WebSocket rooms are not cold-killed mid-match.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 200

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
